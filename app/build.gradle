plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.phucuong.foldfeed'
    compileSdk 35

    defaultConfig {
        applicationId 'vn.phucuong.foldfeed'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Ký bằng khóa debug để cài trực tiếp được, không cần lên Play Store
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
